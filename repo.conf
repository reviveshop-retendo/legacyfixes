# Shared repository configuration.
#
# Set REPO_URL to the address users will add in Cydia/Sileo/Zebra.
# For GitHub Pages this is usually:
#   https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME
REPO_NAME="LegacyFixes"
REPO_URL="https://reviveshop-retendo.github.io/legacyfixes"

# Shown in the Release file.
REPO_ORIGIN="LegacyFixes"
REPO_LABEL="LegacyFixes"
REPO_DESCRIPTION="Compatibility fixes and patches for apps on legacy iOS 6-9 (32-bit)."

# Package version used for the all-in-one metapackage.
VERSION="1.0.0"

# Repository maintainer shown on packages that do not override it.
MAINTAINER="LegacyFixes"
